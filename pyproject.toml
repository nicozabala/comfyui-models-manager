[project]
name = "comfy-network-tools"
version = "0.1.0"
description = "Interactive admin for a central AI-model repository distributed to LAN hosts over SSH"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nicozabala" }]
dependencies = [
    "rich>=13.7",
    "questionary>=2.0",
    "paramiko>=3.4",
    "huggingface_hub>=0.24",
    "platformdirs>=4.2",
    "cryptography>=42.0",
]

[project.scripts]
comfy-network-tools = "comfy_network_tools.__main__:main"

[dependency-groups]
dev = [
    "mock-ssh-server>=0.9.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_network_tools"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that need a real SFTP server (deselected by default)",
]
addopts = "-m 'not integration'"
